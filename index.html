<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Sunset Cafe · Admin Panel</title>

    <!-- ===== FONTS, ICONS, BOOTSTRAP ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;0,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    <style>
        /* ===== FULL ADMIN CSS (same as before) ===== */
        /* (copy the entire admin CSS from the previous version) */
        /* I'll include it in the downloadable version. */
    </style>
</head>
<body>

    <!-- ===== PASSWORD OVERLAY ===== -->
    <div id="passwordOverlay">...</div>

    <!-- ===== ADMIN CONTENT ===== -->
    <div id="adminContent">
        <!-- Header, Stats, Toolbar, Form, Item List – same as before -->
    </div>

    <!-- ===== TOAST & CONFIRM ===== -->
    <div class="toast-container-custom" id="toastContainer"></div>
    <div class="confirm-overlay" id="confirmOverlay">...</div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const CONFIG = {
            repoOwner: 'M1616D',
            repoName: 'Sunset-Cafe',
            menuFileName: 'menu.json',
            adminPassword: 'sunset2024', // Change this!
        };

        // ============================================================
        // DEFAULT MENU (minimal fallback)
        // ============================================================
        const DEFAULT_MENU = [{
            id: 999,
            name: "Loading menu...",
            amName: "ሜኑ እየጫነ ነው...",
            orName: "Menu qopheeffamaa jira...",
            category: "Breakfast",
            price: 0,
            tags: [],
            description: "Please wait while the menu loads from our server.",
            amDescription: "እባክዎ ሜኑ ከአገልጋያችን እስኪጫን ድረስ ይጠብቁ።",
            orDescription: "Maaloo menu server keenya irraa hamma qopheeffamutti eegaa.",
            available: true
        }];

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        // Login
        const passwordOverlay = $('#passwordOverlay');
        const passwordInput = $('#passwordInput');
        const tokenInput = $('#tokenInput');
        const passwordSubmit = $('#passwordSubmit');
        const passwordError = $('#passwordError');

        // Admin content
        const adminContent = $('#adminContent');
        const totalItemsEl = $('#totalItems');
        const availableItemsEl = $('#availableItems');
        const categoryCountEl = $('#categoryCount');
        const unavailableItemsEl = $('#unavailableItems');
        const itemList = $('#itemList');
        const adminSearch = $('#adminSearch');
        const categoryFilter = $('#categoryFilter');
        const statusFilter = $('#statusFilter');
        const addFormContainer = $('#addFormContainer');
        const addForm = $('#addForm');
        const addNewBtn = $('#addNewBtn');
        const cancelFormBtn = $('#cancelFormBtn');
        const formTitle = $('#formTitle');
        const submitBtnText = $('#submitBtnText');
        const submitBtn = $('#submitBtn');
        const editIdInput = $('#editId');
        const fName = $('#fName');
        const fAmName = $('#fAmName');
        const fOrName = $('#fOrName');
        const fCategory = $('#fCategory');
        const fPrice = $('#fPrice');
        const fImage = $('#fImage');
        const fDescription = $('#fDescription');
        const fAmDescription = $('#fAmDescription');
        const fOrDescription = $('#fOrDescription');
        const fAvailable = $('#fAvailable');
        const tagCheckboxes = $('#tagCheckboxes');
        const exportBtn = $('#exportBtn');
        const importBtn = $('#importBtn');
        const importFileInput = $('#importFileInput');
        const resetBtn = $('#resetBtn');
        const confirmOverlay = $('#confirmOverlay');
        const confirmTitle = $('#confirmTitle');
        const confirmMsg = $('#confirmMsg');
        const confirmOk = $('#confirmOk');
        const confirmCancel = $('#confirmCancel');
        const toastContainer = $('#toastContainer');
        const darkToggle = $('#darkToggle');
        const savingIndicator = $('#savingIndicator');

        const ALL_TAGS = ['Vegan', 'Spicy', 'Halal', 'Vegetarian', 'Fasting', 'Gluten-Free', 'Chef Special', 'Bestseller'];
        const CATEGORIES = ['All', 'Breakfast', 'Traditional Foods', 'Burger', 'Pizza', 'Wraps', 'Cakes', 'Juices', 'Syrups',
            'Hot Drinks', 'Cold Drinks', 'Shakes & Smoothies', 'Iced Drinks', 'Herbal Tea'
        ];

        // ============================================================
        // STATE
        // ============================================================
        let menuItems = [];
        let editingId = null;
        let confirmCallback = null;
        let isSaving = false;
        let GITHUB_TOKEN = '';

        // ============================================================
        // LOGIN
        // ============================================================
        function handleLogin() {
            const enteredPassword = passwordInput.value.trim();
            const enteredToken = tokenInput.value.trim();

            if (enteredPassword === CONFIG.adminPassword && enteredToken.startsWith('github_pat_')) {
                sessionStorage.setItem('github_token', enteredToken);
                sessionStorage.setItem('admin_password', enteredPassword);
                passwordOverlay.classList.add('hidden');
                adminContent.classList.add('active');
                GITHUB_TOKEN = enteredToken;
                initAdmin();
                showToast('🔓 Welcome, Admin!', 'success');
            } else {
                passwordError.classList.add('show');
                passwordError.textContent = enteredPassword !== CONFIG.adminPassword ?
                    '❌ Incorrect password' :
                    '❌ Invalid token (must start with "github_pat_")';
                passwordInput.value = '';
                tokenInput.value = '';
                passwordInput.focus();
            }
        }

        passwordSubmit.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
        tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

        // Check session
        (function checkSession() {
            const savedToken = sessionStorage.getItem('github_token');
            const savedPassword = sessionStorage.getItem('admin_password');
            if (savedToken && savedPassword === CONFIG.adminPassword) {
                passwordOverlay.classList.add('hidden');
                adminContent.classList.add('active');
                GITHUB_TOKEN = savedToken;
                if (document.readyState === 'complete' || document.readyState === 'interactive') {
                    initAdmin();
                } else {
                    document.addEventListener('DOMContentLoaded', initAdmin);
                }
            }
        })();

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const icons = { success: 'fas fa-check-circle', error: 'fas fa-exclamation-circle',
                warning: 'fas fa-triangle-exclamation', info: 'fas fa-info-circle' };
            const toast = document.createElement('div');
            toast.className = `toast-custom ${type}`;
            toast.innerHTML =
                `<span class="toast-icon"><i class="${icons[type] || icons.info}"></i></span><span>${message}</span>`;
            toastContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        // ============================================================
        // CONFIRM
        // ============================================================
        function showConfirm(title, msg, callback) {
            confirmTitle.textContent = title;
            confirmMsg.textContent = msg;
            confirmCallback = callback;
            confirmOverlay.classList.add('active');
        }
        confirmCancel.addEventListener('click', () => {
            confirmOverlay.classList.remove('active');
            confirmCallback = null;
        });
        confirmOk.addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            confirmOverlay.classList.remove('active');
            confirmCallback = null;
        });
        confirmOverlay.addEventListener('click', (e) => {
            if (e.target === confirmOverlay) {
                confirmOverlay.classList.remove('active');
                confirmCallback = null;
            }
        });

        // ============================================================
        // GITHUB API
        // ============================================================
        function getApiUrl() {
            return `https://api.github.com/repos/${CONFIG.repoOwner}/${CONFIG.repoName}/contents/${CONFIG.menuFileName}`;
        }

        function getHeaders() {
            return {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            };
        }

        async function loadMenuFromGitHub() {
            try {
                const res = await fetch(getApiUrl(), { headers: getHeaders() });
                if (res.ok) {
                    const data = await res.json();
                    const content = atob(data.content);
                    const parsed = JSON.parse(content);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        menuItems = parsed;
                        return true;
                    }
                } else if (res.status === 404) {
                    menuItems = JSON.parse(JSON.stringify(DEFAULT_MENU));
                    await saveMenuToGitHub();
                    return true;
                }
                menuItems = JSON.parse(JSON.stringify(DEFAULT_MENU));
                await saveMenuToGitHub();
                return true;
            } catch (err) {
                console.warn('Load error:', err);
                menuItems = JSON.parse(JSON.stringify(DEFAULT_MENU));
                return false;
            }
        }

        async function saveMenuToGitHub() {
            if (isSaving) return;
            isSaving = true;
            savingIndicator.classList.add('active');

            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(menuItems, null, 2))));
                let sha = '';
                try {
                    const res = await fetch(getApiUrl(), { headers: getHeaders() });
                    if (res.ok) {
                        const data = await res.json();
                        sha = data.sha;
                    }
                } catch (_) {}

                const payload = {
                    message: `Update menu: ${new Date().toLocaleString()}`,
                    content: content,
                    sha: sha || undefined
                };

                const res = await fetch(getApiUrl(), {
                    method: 'PUT',
                    headers: getHeaders(),
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast('✅ Changes saved to GitHub', 'success');
                } else {
                    const err = await res.json();
                    console.error('Save error:', err);
                    showToast('❌ Failed to save changes: ' + (err.message || 'Unknown error'), 'error');
                }
            } catch (err) {
                console.error('Save error:', err);
                showToast('❌ Failed to save changes. Check your token and repo settings.', 'error');
            } finally {
                isSaving = false;
                savingIndicator.classList.remove('active');
            }
        }

        // ============================================================
        // TAG HELPERS
        // ============================================================
        function getTagClass(tag) {
            const map = { 'Vegan': 'vegan', 'Spicy': 'spicy', 'Halal': 'halal', 'Vegetarian': 'vegetarian',
                'Fasting': 'fasting', 'Gluten-Free': 'gluten-free', 'Chef Special': 'chef-special',
                'Bestseller': 'bestseller' };
            return map[tag] || '';
        }

        function renderTagCheckboxes(selectedTags = []) {
            tagCheckboxes.innerHTML = ALL_TAGS.map(tag => {
                const checked = selectedTags.includes(tag) ? 'checked' : '';
                return `<label class="${checked ? 'checked' : ''}">
                            <input type="checkbox" value="${tag}" ${checked} />
                            ${tag}
                        </label>`;
            }).join('');
            tagCheckboxes.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    this.closest('label').classList.toggle('checked', this.checked);
                });
            });
        }

        function getSelectedTags() {
            const checked = tagCheckboxes.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checked).map(cb => cb.value);
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderStats() {
            const total = menuItems.length;
            const available = menuItems.filter(i => i.available !== false).length;
            const unavailable = total - available;
            const cats = new Set(menuItems.map(i => i.category));
            totalItemsEl.textContent = total;
            availableItemsEl.textContent = available;
            unavailableItemsEl.textContent = unavailable;
            categoryCountEl.textContent = cats.size;
        }

        function renderCategoryFilter() {
            const current = categoryFilter.value;
            categoryFilter.innerHTML = CATEGORIES.map(c =>
                `<option value="${c}" ${c === current ? 'selected' : ''}>${c === 'All' ? 'All Categories' : c}</option>`
            ).join('');
        }

        function renderItems() {
            const search = adminSearch.value.toLowerCase().trim();
            const catFilter = categoryFilter.value;
            const statusFilterVal = statusFilter.value;

            let filtered = menuItems.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(search) ||
                    (item.amName || '').toLowerCase().includes(search) ||
                    (item.orName || '').toLowerCase().includes(search) ||
                    item.category.toLowerCase().includes(search);
                const matchCat = catFilter === 'All' || item.category === catFilter;
                const matchStatus = statusFilterVal === 'All' ||
                    (statusFilterVal === 'Available' && item.available !== false) ||
                    (statusFilterVal === 'Unavailable' && item.available === false);
                return matchSearch && matchCat && matchStatus;
            });

            if (filtered.length === 0) {
                itemList.innerHTML = `
                            <div class="empty-state-admin">
                                <i class="fas fa-utensils"></i>
                                <p>${search ? 'No items match your search.' : 'No menu items yet. Click "Add New" to create one!'}</p>
                                ${!search ? '<button class="btn-add-first" onclick="document.getElementById(\'addNewBtn\').click()"><i class="fas fa-plus"></i> Add Your First Item</button>' : ''}
                            </div>
                        `;
                return;
            }

            itemList.innerHTML = filtered.map(item => {
                const isAvailable = item.available !== false;
                const tagsHtml = (item.tags || []).slice(0, 4).map(t =>
                    `<span class="tag ${getTagClass(t)}">${t}</span>`
                ).join('') + ((item.tags || []).length > 4 ? `<span class="tag" style="font-size:0.4rem;">+${item.tags.length - 4}</span>` :
                    '');
                const statusText = isAvailable ? 'Available' : 'Unavailable';
                const statusClass = isAvailable ? 'available' : 'unavailable';
                const rowClass = isAvailable ? '' : 'unavailable';
                const displayName = item.name;

                return `
                            <div class="item-row ${rowClass}">
                                <span class="item-id">${item.id}</span>
                                <span class="item-name">${displayName}</span>
                                <span class="item-category">${item.category}</span>
                                <span class="item-price">ETB ${item.price}</span>
                                <span class="item-tags">${tagsHtml}</span>
                                <span class="item-status"><span class="dot ${statusClass}"></span> ${statusText}</span>
                                <span class="item-actions">
                                    <button class="toggle-avail ${isAvailable ? '' : 'unavailable-btn'}" title="${isAvailable ? 'Mark unavailable' : 'Mark available'}" data-id="${item.id}"><i class="fas ${isAvailable ? 'fa-eye' : 'fa-eye-slash'}"></i></button>
                                    <button class="edit" title="Edit" data-id="${item.id}"><i class="fas fa-pen"></i></button>
                                    <button class="delete" title="Delete" data-id="${item.id}"><i class="fas fa-trash"></i></button>
                                </span>
                            </div>
                        `;
            }).join('');

            // Event listeners
            itemList.querySelectorAll('.toggle-avail').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    toggleAvailability(id);
                });
            });
            itemList.querySelectorAll('.edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    startEdit(id);
                });
            });
            itemList.querySelectorAll('.delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    confirmDelete(id);
                });
            });
        }

        function renderAll() {
            renderStats();
            renderCategoryFilter();
            renderItems();
        }

        // ============================================================
        // CRUD
        // ============================================================
        function toggleAvailability(id) {
            const item = menuItems.find(i => i.id === id);
            if (!item) return;
            // Toggle the boolean
            item.available = !(item.available !== false);
            saveMenuToGitHub();
            renderAll();
            showToast(`${item.name} is now ${item.available !== false ? 'available' : 'unavailable'}`, item.available !== false ?
                'success' : 'warning');
        }

        function confirmDelete(id) {
            const item = menuItems.find(i => i.id === id);
            if (!item) return;
            showConfirm('Delete Item', `Are you sure you want to delete "${item.name}"? This cannot be undone.`, async () => {
                menuItems = menuItems.filter(i => i.id !== id);
                await saveMenuToGitHub();
                renderAll();
                showToast(`Deleted "${item.name}"`, 'error');
            });
        }

        function startEdit(id) {
            const item = menuItems.find(i => i.id === id);
            if (!item) return;
            editingId = id;
            formTitle.textContent = 'Edit Item';
            submitBtnText.textContent = 'Update Item';
            editIdInput.value = id;
            fName.value = item.name || '';
            fAmName.value = item.amName || '';
            fOrName.value = item.orName || '';
            fCategory.value = item.category || 'Breakfast';
            fPrice.value = item.price || 0;
            fImage.value = item.image || '';
            fDescription.value = item.description || '';
            fAmDescription.value = item.amDescription || '';
            fOrDescription.value = item.orDescription || '';
            fAvailable.value = item.available !== false ? 'true' : 'false';
            renderTagCheckboxes(item.tags || []);
            addFormContainer.classList.add('open');
            addFormContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
            fName.focus();
        }

        function resetForm() {
            editingId = null;
            editIdInput.value = '';
            formTitle.textContent = 'Add New Item';
            submitBtnText.textContent = 'Add Item';
            fName.value = '';
            fAmName.value = '';
            fOrName.value = '';
            fCategory.value = 'Breakfast';
            fPrice.value = '';
            fImage.value = '';
            fDescription.value = '';
            fAmDescription.value = '';
            fOrDescription.value = '';
            fAvailable.value = 'true';
            renderTagCheckboxes([]);
            addFormContainer.classList.remove('open');
        }

        function generateId() {
            const maxId = menuItems.reduce((max, i) => Math.max(max, i.id), 0);
            return maxId + 1;
        }

        // ============================================================
        // FORM HANDLING
        // ============================================================
        addForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = fName.value.trim();
            const category = fCategory.value;
            const price = parseInt(fPrice.value);
            const description = fDescription.value.trim();

            if (!name) { showToast('Item name is required', 'error'); return; }
            if (!category) { showToast('Category is required', 'error'); return; }
            if (isNaN(price) || price < 0) { showToast('Valid price is required', 'error'); return; }
            if (!description) { showToast('Description is required', 'error'); return; }

            const tags = getSelectedTags();
            const available = fAvailable.value === 'true';

            const itemData = {
                id: editingId || generateId(),
                name: name,
                amName: fAmName.value.trim() || '',
                orName: fOrName.value.trim() || '',
                category: category,
                price: price,
                tags: tags,
                description: description,
                amDescription: fAmDescription.value.trim() || '',
                orDescription: fOrDescription.value.trim() || '',
                image: fImage.value.trim() || '',
                available: available
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-sm"></span> Saving...';

            if (editingId) {
                const idx = menuItems.findIndex(i => i.id === editingId);
                if (idx !== -1) {
                    menuItems[idx] = itemData;
                    await saveMenuToGitHub();
                    showToast(`✅ Updated "${itemData.name}"`, 'success');
                }
            } else {
                menuItems.push(itemData);
                await saveMenuToGitHub();
                showToast(`✅ Added "${itemData.name}"`, 'success');
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-save"></i> ' + (editingId ? 'Update Item' : 'Add Item');

            renderAll();
            resetForm();
        });

        cancelFormBtn.addEventListener('click', resetForm);

        addNewBtn.addEventListener('click', () => {
            resetForm();
            addFormContainer.classList.add('open');
            addFormContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
            fName.focus();
        });

        // ============================================================
        // EXPORT / IMPORT
        // ============================================================
        exportBtn.addEventListener('click', () => {
            try {
                const data = JSON.stringify(menuItems, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sunset_menu_backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📥 Menu exported successfully!', 'success');
            } catch (_) {
                showToast('Export failed', 'error');
            }
        });

        importBtn.addEventListener('click', () => {
            importFileInput.click();
        });

        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data) && data.length > 0) {
                        showConfirm('Import Menu',
                            `This will replace all current menu items (${menuItems.length} items) with the imported data (${data.length} items). Continue?`,
                            async () => {
                                menuItems = data;
                                await saveMenuToGitHub();
                                renderAll();
                                showToast(`✅ Imported ${data.length} items successfully!`, 'success');
                                importFileInput.value = '';
                            });
                    } else {
                        showToast('Invalid data: expected an array of items', 'error');
                        importFileInput.value = '';
                    }
                } catch (_) {
                    showToast('Invalid JSON file', 'error');
                    importFileInput.value = '';
                }
            };
            reader.readAsText(file);
        });

        // ============================================================
        // RESET
        // ============================================================
        resetBtn.addEventListener('click', () => {
            showConfirm('Reset Menu',
                `This will restore the default menu (${DEFAULT_MENU.length} items) and discard all changes. Continue?`,
                async () => {
                    menuItems = JSON.parse(JSON.stringify(DEFAULT_MENU));
                    await saveMenuToGitHub();
                    renderAll();
                    showToast('🔄 Menu reset to default', 'warning');
                });
        });

        // ============================================================
        // SEARCH & FILTER
        // ============================================================
        adminSearch.addEventListener('input', renderItems);
        categoryFilter.addEventListener('change', renderItems);
        statusFilter.addEventListener('change', renderItems);

        // ============================================================
        // DARK MODE
        // ============================================================
        function initTheme() {
            const stored = localStorage.getItem('admin_theme');
            if (stored === 'light') {
                document.documentElement.setAttribute('data-bs-theme', 'light');
                darkToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
                darkToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        darkToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-bs-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', next);
            localStorage.setItem('admin_theme', next);
            darkToggle.innerHTML = next === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        });

        // ============================================================
        // INIT
        // ============================================================
        async function initAdmin() {
            initTheme();
            fCategory.innerHTML = CATEGORIES.filter(c => c !== 'All').map(c =>
                `<option value="${c}">${c}</option>`
            ).join('');

            await loadMenuFromGitHub();
            renderAll();
            showToast('☕ Admin Panel ready — manage your menu with ease!', 'info');
            console.log(`📋 Admin loaded with ${menuItems.length} menu items.`);
            console.log(`🔗 Repository: ${CONFIG.repoOwner}/${CONFIG.repoName}`);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !passwordOverlay.classList.contains('hidden')) {
                handleLogin();
            }
        });

        console.log('🔐 Admin panel ready – enter password and token to continue.');
        if (!passwordOverlay.classList.contains('hidden')) {
            passwordInput.focus();
        }
    </script>
</body>
</html>
